name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode Project
        run: swift package generate-xcodeproj || true

      - name: Compile App Bundle
        run: |
          xcodebuild -scheme My_App-Package \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     PRODUCT_BUNDLE_IDENTIFIER=com.test.jitemulator

      - name: Package IPA
        run: |
          mkdir -p Payload/JITEmulator.app
          
          # Copy executable binary
          EXEC_PATH=$(find build/Build/Products -type f -name "My_App" | head -n 1)
          cp "$EXEC_PATH" Payload/JITEmulator.app/My_App
          
          # Create Info.plist using PlistBuddy (avoids YAML parsing errors)
          PLIST="Payload/JITEmulator.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string My_App" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.test.jitemulator" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string JITEmulator" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$PLIST"
          
          zip -r JITEmulator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JITEmulator-IPA
          path: JITEmulator.ipa
