name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compile App Bundle
        run: |
          # Build target for iOS arm64 using SwiftPM
          xcodebuild -scheme My_App \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Find generated .app folder and move it to Payload
          find build/Build/Products -name "*.app" -exec cp -r {} Payload/ \;
          zip -r JITEmulator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JITEmulator-IPA
          path: JITEmulator.ipa
